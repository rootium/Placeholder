<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pressd">
  <title>Pressd</title>
  <!-- Three ink drums, overprinting the way a riso does. -->
  <g style="mix-blend-mode:multiply" isolation="isolate">
    <circle cx="24" cy="24" r="18" fill="#ff48b0" opacity="0.9"/>
    <circle cx="40" cy="26" r="18" fill="#ffd400" opacity="0.85" style="mix-blend-mode:multiply"/>
    <circle cx="32" cy="40" r="18" fill="#0078bf" opacity="0.8" style="mix-blend-mode:multiply"/>
  </g>
</svg>
